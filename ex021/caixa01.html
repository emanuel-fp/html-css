<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modelo caixs</title>

    <style>
        h1 {
            background-color: lightblue;
            height: 300px;
            width: 300px;
            border: 5px solid black;
            margin: auto;
            padding: 10px 5px 90px 34px;
            outline: 5px solid blue;
        }
        a {

            border: 6px double black;
            padding: 10px 50px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>exemplo caixa box-level</h1>
    <p>paragrafos são box-level mas <a href="#">links</a> são inline-level</p>
</body>

</html>
