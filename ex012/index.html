<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videos</title>
</head>
<body>
    <h1>vindos hospedados localmente</h1>
    <p>video feito no meu server</p>
    <video poster="imagens/montanhas-rochosas.webp" width="500px" controls>
        <source src="midia/meu-video.mkv" type="video/x-matroska">
        <source src="midia/meu-video.mp4" type="video/mp4">
        <source src="midia/meu-video.webm" type="video/webm">
        <p>midia não compativel com os tipos de video disponiveis</p>
    </video>
    <h1>com a insertação de video do youtube</h1>
    <iframe width="560" height="315"  src="https://www.youtube-nocookie.com/embed/6stlCkUDG_s?si=fQWOsgMTWhja0J1i" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    
</body>
</html>
