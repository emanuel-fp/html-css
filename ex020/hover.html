<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo hover</title>

    <style>
        
        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
            color: white;
            background-color: black;
            width: fit-content;
        }
    </style>
</head>
<body>
    <h1>Hover</h1>
    <p>passe o mouse</p>
    <div>
        aqui
        <p>texto escondido</p>
    </div>
</body>
</html>
