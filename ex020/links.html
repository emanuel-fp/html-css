<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>

    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 2em;
        }
        a {
            color: red;
            text-decoration: none;
        }
        a:visited {
            color: lightcoral;
        }
        a:hover {
            color: lightcoral;
            background-color: lightgray;
        }
        a:active {
            color: lightsalmon;
        }
        

        a:hover::before {
            content: '→ ';
        }
    </style>
</head>
<body>
    <h1>personalizando links</h1>
    <ul>
        <li><a target="_blank" rel="noopener noreferrer" href="https://gustavoguanabara.github.io/">repositorio</a></li>
        <li><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/@cursoemvideo">canal</a></li>
        <li><a href="https://www.cursoemvideo.com/" target="_blank" rel="noopener noreferrer">site</a></li>
    </ul>
</body>
</html>
